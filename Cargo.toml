[package]
name = "btfmt"
version = "0.3.3"
edition = "2021"
license = "Unlicense"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.13"
tokio = { version = "1.40", features = ["full"] }
tower-lsp = "0.20"
tree-sitter = "0.25"
tree-sitter-bpftrace = "=0.3.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
