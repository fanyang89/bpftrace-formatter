# https://taskfile.dev
version: "3"

vars:
  BINARY: btfmt

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  # ─────────────────────────────────────────────────────────────
  # Build & Development
  # ─────────────────────────────────────────────────────────────

  build:
    desc: Build the btfmt binary
    sources:
      - "src/**/*.rs"
      - Cargo.toml
      - Cargo.lock
    generates:
      - "{{.BINARY}}"
    cmds:
      - cargo build --bin btfmt
      - cp target/debug/btfmt {{.BINARY}}

  compile-grammar:
    desc: Deprecated; Rust uses tree-sitter-bpftrace from crates.io
    cmds:
      - cargo check

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BINARY}}
      - rm -f vscode-extension/*.vsix

  # ─────────────────────────────────────────────────────────────
  # Code Quality
  # ─────────────────────────────────────────────────────────────

  fmt:
    desc: Format Rust code
    cmds:
      - cargo fmt

  fmt-check:
    desc: Check Rust formatting
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Run clippy
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings

  vet:
    desc: Run cargo check
    cmds:
      - cargo check --all-targets

  check:
    desc: Run all code quality checks (fmt, vet, lint)
    cmds:
      - task: fmt-check
      - task: vet
      - task: lint

  # ─────────────────────────────────────────────────────────────
  # Testing
  # ─────────────────────────────────────────────────────────────

  test:
    desc: Run Rust tests
    cmds:
      - cargo test

  test:verbose:
    desc: Run Rust tests with verbose output
    cmds:
      - cargo test -- --nocapture

  test:cover:
    desc: Run tests with coverage report
    cmds:
      - cargo test

  test-tools:
    desc: Run tests against the bpftrace tools corpus
    cmds:
      - for f in tests/corpus/bpftrace-tools/*.bt; do cargo run --quiet -- "$f" >/tmp/btfmt-tools.out || exit 1; done

  lsp-smoke:
    desc: Smoke test for btfmt LSP (stdio)
    deps:
      - build
    cmds:
      - python3 scripts/lsp_smoke.py

  # ─────────────────────────────────────────────────────────────
  # VS Code Extension
  # ─────────────────────────────────────────────────────────────

  vscode:install:
    desc: Install dependencies for the VS Code extension
    dir: vscode-extension
    cmds:
      - npm ci

  vscode:typecheck:
    desc: Check VS Code extension types
    dir: vscode-extension
    deps:
      - vscode:install
    cmds:
      - npm run typecheck

  vscode:build:
    desc: Build the VS Code extension
    dir: vscode-extension
    deps:
      - vscode:install
    cmds:
      - npm run typecheck
      - npm run compile

  vscode:test:
    desc: Run VS Code Extension Host test
    dir: vscode-extension
    deps:
      - vscode:install
    env:
      BTFMT_PATH: ../target/debug/btfmt
    cmds:
      - cargo build --manifest-path ../Cargo.toml --bin btfmt
      - xvfb-run -a npm test

  vscode:package:
    desc: Package a platform-specific VSIX (requires TARGET and BINARY)
    dir: vscode-extension
    requires:
      vars:
        - TARGET
        - BINARY
    deps:
      - vscode:build
    cmds:
      - node scripts/package.mjs "{{.TARGET}}" "{{.BINARY}}"

  # ─────────────────────────────────────────────────────────────
  # CI / Release
  # ─────────────────────────────────────────────────────────────

  ci:
    desc: Run all CI checks
    cmds:
      - task: fmt-check
      - task: vet
      - task: lint
      - task: test
      - task: vscode:build
      - task: vscode:test

  all:
    desc: Build and test everything
    cmds:
      - task: build
      - task: test
      - task: vscode:build

  gh-review:
    desc: Notify bot to review on the current PR
    cmds:
      - gh pr comment --body "@codex review"
      - gh pr comment --body "@gemini-code-assist review"
