# https://taskfile.dev
version: "3"

vars:
  BINARY: btfmt

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  # ─────────────────────────────────────────────────────────────
  # Build & Development
  # ─────────────────────────────────────────────────────────────

  build:
    desc: Build the btfmt binary
    sources:
      - "src/**/*.rs"
      - Cargo.toml
      - Cargo.lock
    generates:
      - "{{.BINARY}}"
    cmds:
      - cargo build --bin btfmt
      - cp target/debug/btfmt {{.BINARY}}

  compile-grammar:
    desc: Deprecated; Rust uses tree-sitter-bpftrace from crates.io
    cmds:
      - cargo check

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BINARY}}
      - rm -f vscode-extension/*.vsix

  # ─────────────────────────────────────────────────────────────
  # Code Quality
  # ─────────────────────────────────────────────────────────────

  fmt:
    desc: Format Rust code
    cmds:
      - cargo fmt

  lint:
    desc: Run clippy
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings

  vet:
    desc: Run cargo check
    cmds:
      - cargo check --all-targets

  check:
    desc: Run all code quality checks (fmt, vet, lint)
    cmds:
      - task: fmt
      - task: vet
      - task: lint

  # ─────────────────────────────────────────────────────────────
  # Testing
  # ─────────────────────────────────────────────────────────────

  test:
    desc: Run Rust tests
    cmds:
      - cargo test

  test:verbose:
    desc: Run Rust tests with verbose output
    cmds:
      - cargo test -- --nocapture

  test:cover:
    desc: Run tests with coverage report
    cmds:
      - cargo test

  test-tools:
    desc: Run tests against bpftrace/tools
    cmds:
      - for f in bpftrace/tools/*.bt; do cargo run --quiet -- "$f" >/tmp/btfmt-tools.out || exit 1; done

  lsp-smoke:
    desc: Smoke test for btfmt LSP (stdio)
    deps:
      - build
    cmds:
      - python3 scripts/lsp_smoke.py

  # ─────────────────────────────────────────────────────────────
  # VS Code Extension
  # ─────────────────────────────────────────────────────────────

  vscode:install:
    desc: Install dependencies for the VS Code extension
    dir: vscode-extension
    cmds:
      - npm install

  vscode:build:
    desc: Build the VS Code extension
    dir: vscode-extension
    deps:
      - vscode:install
    cmds:
      - npm run compile

  vscode:package:
    desc: Package the VS Code extension (vsix)
    dir: vscode-extension
    deps:
      - vscode:build
    cmds:
      - npx vsce package

  vscode:publish:
    desc: Publish the VS Code extension (requires VSCE_PAT)
    dir: vscode-extension
    deps:
      - vscode:build
    cmds:
      - npx vsce publish

  # ─────────────────────────────────────────────────────────────
  # CI / Release
  # ─────────────────────────────────────────────────────────────

  ci:
    desc: Run all CI checks (format, vet, test)
    cmds:
      - task: fmt
      - task: vet
      - task: test

  all:
    desc: Build and test everything
    cmds:
      - task: build
      - task: test

  gh-review:
    desc: Notify bot to review on the current PR
    cmds:
      - gh pr comment --body "@codex review"
      - gh pr comment --body "@gemini-code-assist review"
