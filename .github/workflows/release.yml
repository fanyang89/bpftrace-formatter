name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import tomllib

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]
          extension = json.loads(pathlib.Path("vscode-extension/package.json").read_text())["version"]
          if cargo != expected or extension != expected:
              raise SystemExit(
                  f"release tag {expected!r} does not match Cargo {cargo!r} and extension {extension!r}"
              )
          PY

  build-binaries:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            vscode_target: linux-x64
            binary_name: btfmt
          - os: macos-15-intel
            platform: darwin
            arch: amd64
            vscode_target: darwin-x64
            binary_name: btfmt
          - os: macos-14
            platform: darwin
            arch: arm64
            vscode_target: darwin-arm64
            binary_name: btfmt
          - os: windows-latest
            platform: windows
            arch: amd64
            vscode_target: win32-x64
            binary_name: btfmt.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build btfmt
        run: cargo build --release --bin btfmt

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary_name }}" "dist/${{ matrix.binary_name }}"

      - name: Package (tar.gz)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          ARCHIVE_NAME=btfmt-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          tar -C dist -czvf ${ARCHIVE_NAME} btfmt
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Package (zip)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $archiveName = "btfmt-${{ matrix.platform }}-${{ matrix.arch }}.zip"
          Compress-Archive -Path "dist/${{ matrix.binary_name }}" -DestinationPath $archiveName -Force
          "ARCHIVE_NAME=$archiveName" >> $env:GITHUB_ENV

      - name: Upload binary archive
        uses: actions/upload-artifact@v4
        with:
          name: btfmt-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.ARCHIVE_NAME }}

      - name: Prepare binary for VS Code extension
        shell: bash
        run: |
          mkdir -p vscode-binary
          cp "dist/${{ matrix.binary_name }}" vscode-binary/

      - name: Upload binary for VS Code extension
        uses: actions/upload-artifact@v4
        with:
          name: vscode-binary-${{ matrix.vscode_target }}
          path: vscode-binary/

  build-vscode-extensions:
    needs: build-binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vscode_target: linux-x64
            binary_name: btfmt
          - vscode_target: darwin-x64
            binary_name: btfmt
          - vscode_target: darwin-arm64
            binary_name: btfmt
          - vscode_target: win32-x64
            binary_name: btfmt.exe
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: vscode-binary-${{ matrix.vscode_target }}
          path: vscode-extension/bin

      - name: Make binary executable
        if: matrix.vscode_target != 'win32-x64' && matrix.vscode_target != 'win32-arm64'
        run: chmod +x vscode-extension/bin/btfmt

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Check types
        working-directory: vscode-extension
        run: npm run typecheck

      - name: Build extension
        working-directory: vscode-extension
        run: npm run vscode:prepublish

      - name: Verify bundled binary
        working-directory: vscode-extension
        run: test -f "bin/${{ matrix.binary_name }}"

      - name: Package platform-specific extension
        working-directory: vscode-extension
        run: npx vsce package --no-dependencies --target ${{ matrix.vscode_target }}

      - name: Verify extension contents
        working-directory: vscode-extension
        run: npx vsce ls | grep -Fx "bin/${{ matrix.binary_name }}"

      - name: Find VSIX file
        id: find-vsix
        working-directory: vscode-extension
        run: |
          VSIX_FILE=$(ls *.vsix)
          echo "vsix_file=${VSIX_FILE}" >> $GITHUB_OUTPUT

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-${{ matrix.vscode_target }}
          path: vscode-extension/${{ steps.find-vsix.outputs.vsix_file }}

  publish:
    needs: [build-binaries, build-vscode-extensions]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          # Copy binary archives
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          # Copy all vsix files
          find artifacts -type f -name "*.vsix" -exec cp {} release/ \;
          ls -la release/

      - name: Generate checksums
        working-directory: release
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
