name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build without publishing
        required: true
        default: '0.3.1'
      pre_release:
        description: Package VSIX files for the Marketplace pre-release channel
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release versions
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import tomllib

          expected = os.environ["RELEASE_VERSION"].removeprefix("v")
          cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]
          extension = json.loads(pathlib.Path("vscode-extension/package.json").read_text())["version"]
          if cargo != expected or extension != expected:
              raise SystemExit(
                  f"release tag {expected!r} does not match Cargo {cargo!r} and extension {extension!r}"
              )
          PY

  test:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Check Rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features

      - name: Check extension
        working-directory: vscode-extension
        run: |
          npm run typecheck
          npm run compile
          npx vsce ls --no-dependencies

      - name: Build Extension Host server
        run: cargo build --bin btfmt

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install --yes xvfb

      - name: Run Extension Host test
        working-directory: vscode-extension
        env:
          BTFMT_PATH: ../target/debug/btfmt
        run: xvfb-run -a npm test

  build-binaries:
    needs: [validate-version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            vscode_target: linux-x64
            binary_name: btfmt
          - os: macos-15-intel
            platform: darwin
            arch: amd64
            vscode_target: darwin-x64
            binary_name: btfmt
          - os: macos-14
            platform: darwin
            arch: arm64
            vscode_target: darwin-arm64
            binary_name: btfmt
          - os: windows-latest
            platform: windows
            arch: amd64
            vscode_target: win32-x64
            binary_name: btfmt.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Build btfmt
        run: cargo build --release --bin btfmt

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary_name }}" "dist/${{ matrix.binary_name }}"

      - name: Package (tar.gz)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          ARCHIVE_NAME=btfmt-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          tar -C dist -czvf ${ARCHIVE_NAME} btfmt
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Package (zip)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $archiveName = "btfmt-${{ matrix.platform }}-${{ matrix.arch }}.zip"
          Compress-Archive -Path "dist/${{ matrix.binary_name }}" -DestinationPath $archiveName -Force
          "ARCHIVE_NAME=$archiveName" >> $env:GITHUB_ENV

      - name: Upload binary archive
        uses: actions/upload-artifact@v4
        with:
          name: btfmt-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.ARCHIVE_NAME }}

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Check types
        working-directory: vscode-extension
        run: npm run typecheck

      - name: Package Marketplace pre-release VSIX
        if: github.event_name == 'workflow_dispatch' && inputs.pre_release
        working-directory: vscode-extension
        run: node scripts/package.mjs "${{ matrix.vscode_target }}" "../target/release/${{ matrix.binary_name }}" pre-release

      - name: Package release VSIX
        if: github.event_name != 'workflow_dispatch' || !inputs.pre_release
        working-directory: vscode-extension
        run: node scripts/package.mjs "${{ matrix.vscode_target }}" "../target/release/${{ matrix.binary_name }}" release

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-${{ matrix.vscode_target }}
          path: vscode-extension/*.vsix
          if-no-files-found: error

  release:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/downloads

      - name: Prepare release files
        run: |
          mkdir -p artifacts/release
          find artifacts/downloads -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.vsix" \) -exec cp {} artifacts/release/ \;
          ls -la artifacts/release/

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build snapshot release bundle
        if: github.event_name == 'workflow_dispatch'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --snapshot --clean

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            artifacts/release/*
            dist/checksums.txt
